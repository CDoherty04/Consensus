AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Telegram AI Finance Bot serverless stack (KMS-backed wallets + x402)
Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        TELEGRAM_TOKEN:
          Ref: TelegramToken
        ANTHROPIC_API_KEY:
          Ref: AnthropicApiKey
        DYNAMODB_TABLE:
          Ref: AgentBotUsersTable
        COINGECKO_API_KEY:
          Ref: CoingeckoApiKey
        WALLET_KMS_KEY_ID:
          Ref: AgentWalletKey
        WALLET_NETWORK:
          Ref: WalletNetwork
Parameters:
  TelegramToken:
    Type: String
    NoEcho: true
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Leave blank to disable AI Mode (Claude tool use).
  CoingeckoApiKey:
    Type: String
    NoEcho: true
    Default: ''
  WalletNetwork:
    Type: String
    Default: base-sepolia
    AllowedValues:
    - base-sepolia
    - base-mainnet
    - optimism
Resources:
  AgentWalletKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts agent wallet private keys for the Telegram finance bot
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Sid: EnableRoot
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
  AgentWalletKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/agent-bot-wallet
      TargetKeyId:
        Ref: AgentWalletKey
  AgentBotUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: agent_bot_users
      AttributeDefinitions:
      - AttributeName: telegram_user_id
        AttributeType: S
      KeySchema:
      - AttributeName: telegram_user_id
        KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: telegram-finance-webhook
      Handler: handler.lambda_handler
      Timeout: 30
      CodeUri: WebhookFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AgentBotUsersTable
      - Statement:
        - Effect: Allow
          Action:
          - kms:Encrypt
          - kms:Decrypt
          - kms:GenerateDataKey
          - kms:DescribeKey
          Resource:
            Fn::GetAtt:
            - AgentWalletKey
            - Arn
      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /webhook
            Method: post
    Metadata:
      SamResourceId: WebhookFunction
  ScheduledPaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: telegram-finance-scheduled-payments
      Handler: scheduler/payments.lambda_handler
      Timeout: 300
      CodeUri: ScheduledPaymentsFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AgentBotUsersTable
      - Statement:
        - Effect: Allow
          Action:
          - kms:Decrypt
          - kms:DescribeKey
          Resource:
            Fn::GetAtt:
            - AgentWalletKey
            - Arn
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
    Metadata:
      SamResourceId: ScheduledPaymentsFunction
  PriceAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: telegram-finance-price-alerts
      Handler: scheduler/price_alerts.lambda_handler
      Timeout: 300
      CodeUri: PriceAlertsFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AgentBotUsersTable
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
    Metadata:
      SamResourceId: PriceAlertsFunction
  FeedDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: telegram-finance-feed-digest
      Handler: scheduler/feed_digest.lambda_handler
      Timeout: 300
      CodeUri: FeedDigestFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AgentBotUsersTable
      Events:
        DailyAt8UTC:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 * * ? *)
    Metadata:
      SamResourceId: FeedDigestFunction
Outputs:
  WebhookUrl:
    Description: API Gateway webhook URL for Telegram
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook
  DynamoTableName:
    Description: DynamoDB table name
    Value:
      Ref: AgentBotUsersTable
  WalletKmsKeyArn:
    Description: KMS key used to encrypt agent wallet private keys
    Value:
      Fn::GetAtt:
      - AgentWalletKey
      - Arn
  WalletKmsKeyAlias:
    Description: KMS alias for the wallet key
    Value:
      Ref: AgentWalletKeyAlias
